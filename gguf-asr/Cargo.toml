[package]
name = "gguf-asr"
version = "0.1.0"
edition = "2024"
description = "Standalone GGUF speech-to-text inference stack inspired by Hex, reimplemented and extended (engine thread, streaming, diarization, offline fallback)"
license = "MIT"

[dependencies]
eyre = "0.6.14"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
# 实际源码由根 Cargo.toml 的 [patch.crates-io] 指向 fork
# (vendor/transcribe.cpp submodule, 分支 wxasr/main)。=0.4.1 仍保留:
# 绑定在加载时校验原生库版本(pre-1.0 base-version lock),两半必须一致。
transcribe-cpp-sys = "=0.4.1"

# GPU 后端按平台选(fork 的 build.rs:metal 只在 Apple 目标生效并嵌入
# metallib;vulkan 在 Apple 上会因找不到 Vulkan SDK 配置直接失败)。
# 安全 crate 的 API 不随后端 feature 变化,拆分无感。
# 注意 TOML:[target.*] 表会吞并其后直到下一表头的普通依赖,故置于段尾。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["vulkan"] }

[dev-dependencies]
hound = "3"
# native_probe 诊断用:把 transcribe_cpp::init_logging 接进来的
# native/ggml 日志放到 stderr(默认无人订阅,原生诊断被吞)
env_logger = "0.11"
