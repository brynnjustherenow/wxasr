[package]
name = "hex-asr"
version = "0.1.0"
edition = "2024"
description = "Standalone GGUF speech-to-text inference stack extracted from Hex (engine thread, streaming, offline fallback)"
license = "MIT"

[dependencies]
eyre = "0.6.14"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
transcribe-cpp = { version = "=0.4.1", features = ["vulkan"] }
# Pin the native half to the exact version the 0.4.1 bindings check for at
# load: their "0.4.1" requirement otherwise resolves to transcribe-cpp-sys
# 0.4.2, whose native library reports 0.4.2 and is rejected by the
# pre-1.0 base-version lock ("native library version mismatch").
transcribe-cpp-sys = "=0.4.1"

[dev-dependencies]
hound = "3"
# native_probe 诊断用:把 transcribe_cpp::init_logging 接进来的
# native/ggml 日志放到 stderr(默认无人订阅,原生诊断被吞)
env_logger = "0.11"
