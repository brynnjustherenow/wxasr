[package]
name = "wxasr-async"
version = "0.1.0"
edition = "2021"
description = "流式 ASR 统一异步层：专用识别线程 + tokio mpsc 事件桥；wxasr 为首个后端（上下文轮换定稿、中间结果节流）"
license = "MIT"

[dependencies]
wxasr = { path = "../wxasr" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v7"] }
eyre = "0.6.14"
rubato = "5.0.1"
hex-asr = { path = "../hex-asr", optional = true }

[features]
# hex-asr 后端(transcribe-cpp GGUF 推理栈):默认不开,启用需要
# CMake + Vulkan SDK 的构建环境(见 hex-asr 的文档)
hex = ["dep:hex-asr"]

[dev-dependencies]
hound = "3"
crossterm = "0.29"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
wxasr-provider = { path = "../wxasr-provider" }

# 数值计算在 wxasr 里，让依赖在 debug 测试下也可用
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
